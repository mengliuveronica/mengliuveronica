# Based off of https://github.com/lowlighter/metrics
name: Metrics
on:
  # Daily updates
  schedule: [{cron: "0 0 * * *"}]
  push: {branches: ["main"]}
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Personal access token (classic) with public_repo + read:user scopes,
          # stored as a repository secret named METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # Options
          user: mengliuveronica
          template: classic
          # Header only; the activity/community/repositories sections are mostly zero rows
          base: header, metadata
          config_animations: yes
          config_timezone: Asia/Shanghai
          # GitHub's GraphQL API times out (502) when fetching 100 repositories
          # at once for this account; smaller batches succeed
          repositories_batch: 25

          # Language breakdown (most-used only; "recently used" relies on event
          # payloads GitHub no longer returns and errors out)
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, tex, scss, dockerfile, makefile, shell, plpgsql, rich text format
          plugin_languages_limit: 6
          plugin_languages_details: percentage

          # Isometric commit calendar for the past year
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Classic heatmap for the last three years
          plugin_calendar: yes
          plugin_calendar_limit: 3
